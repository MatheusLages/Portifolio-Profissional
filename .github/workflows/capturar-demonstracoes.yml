name: Gerar demonstracoes reais do portfolio
on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'docs/wireframes/**'
      - 'docs/demonstracoes/**'
      - '.github/workflows/capturar-demonstracoes.yml'
      - '.github/workflows/padronizar-historico.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  capturar:
    runs-on: ubuntu-latest
    steps:
      - name: Obter arquivos do portfolio
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preparar navegador
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Obter projeto Prova1-DIW
        run: git clone --depth 1 https://github.com/MatheusLages/Prova1-DIW.git .prova-diw
      - name: Capturar telas dos projetos
        run: node .github/scripts/capturar-demonstracoes.cjs
      - name: Salvar capturas no repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/demonstracoes
          if ! git diff --cached --quiet; then
            git commit -m "Add files via upload"
            git push origin HEAD:main
          fi
