name: Padronizar mensagens de commits
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/padronizar-historico.yml'
permissions:
  contents: write
jobs:
  padronizar:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar historico completo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reescrever mensagens preservando todos os arquivos
        run: |
          set -euo pipefail
          ORIGINAL_HEAD="$(git rev-parse HEAD)"
          TREE_BEFORE="$(git rev-parse HEAD^{tree})"
          export FILTER_BRANCH_SQUELCH_WARNING=1
          git filter-branch --force --msg-filter 'echo "Add files via upload"' -- HEAD
          TREE_AFTER="$(git rev-parse HEAD^{tree})"
          if [ "$TREE_BEFORE" != "$TREE_AFTER" ]; then
            echo "O conteudo mudou; abortando sem publicar."
            exit 1
          fi
          INCORRETAS="$(git log --format=%s | grep -v -x 'Add files via upload' || true)"
          if [ -n "$INCORRETAS" ]; then
            echo "Restaram mensagens diferentes: $INCORRETAS"
            exit 1
          fi
          git push --force-with-lease="refs/heads/main:$ORIGINAL_HEAD" origin HEAD:refs/heads/main
